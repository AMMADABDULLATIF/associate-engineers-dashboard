<!DOCTYPE html>

<script id="ae-console-noise-filter">
(function() {
  function safeToText(x) {
    if (x === null || x === undefined) return String(x);
    if (typeof x !== 'object') return String(x);
    if (x instanceof Error) return (x.name || 'Error') + ': ' + (x.message || '');
    try {
      var seen = [];
      return JSON.stringify(x, function(_k, val) {
        if (val !== null && typeof val === 'object') {
          if (seen.indexOf(val) !== -1) return '[Circular]';
          seen.push(val);
        }
        return val;
      });
    } catch (e) {
      try { return String(x); } catch (e2) { return '[Object]'; }
    }
  }

  var _err = console.error;
  console.error = function() {
    var args = Array.prototype.slice.call(arguments);
    var str = args.map(safeToText).join(' ');
    if (str.indexOf('failed to connect to websocket') !== -1 || (str.indexOf('vite') !== -1 && str.indexOf('websocket') !== -1)) {
      return;
    }
    _err.apply(console, args);
  };

  var _warn = console.warn;
  console.warn = function() {
    var args = Array.prototype.slice.call(arguments);
    var str = args.map(safeToText).join(' ');
    if (str.indexOf('enableMultiTabIndexedDbPersistence') !== -1 || str.indexOf('FirestoreSettings.cache') !== -1) {
      return;
    }
    _warn.apply(console, args);
  };
})();
</script>

<script id="ae-theme-bootstrap">
(function () {
  try {
    var saved = localStorage.getItem('AE_THEME_MODE');
    var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
    var root = document.documentElement;
    root.setAttribute('data-theme', theme);
    root.classList.remove('dark', 'light');
    root.classList.add(theme);
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', theme === 'light' ? '#f3f6fb' : '#030712');
  } catch (e) {}
})();
</script>

<body class="min-h-screen flex flex-col justify-between custom-scrollbar select-none bg-slate-950">
  <div id="root"></div>
  <script id="ae-dev-sw-cleanup">
  (function() {
    try {
      var scripts = document.getElementsByTagName('script');
      var isDevHtml = false;
      for (var i = 0; i < scripts.length; i++) {
        if (scripts[i].getAttribute('src') === '/src/main.tsx') { isDevHtml = true; break; }
      }
      if (isDevHtml && 'serviceWorker' in navigator) {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        }).then(function() {
          if ('caches' in window) {
            return caches.keys().then(function(keys) {
              return Promise.all(keys.filter(function(k) { return k.indexOf('associate-engineers-') === 0; }).map(function(k) { return caches.delete(k); }));
            });
          }
        }).then(function() {
          if (hadController && !sessionStorage.getItem('ae_dev_sw_reset')) {
            sessionStorage.setItem('ae_dev_sw_reset', '1');
            window.location.reload();
          }
        }).catch(function() {});
      }
    } catch (e) {}
  })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
